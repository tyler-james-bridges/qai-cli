name: qai

# This workflow is designed to be copied to your repository.
# It can run manually OR on pull requests.
#
# For PR testing, you need a preview deployment. Options:
# 1. Vercel/Netlify: Set PREVIEW_URL env var in your deployment workflow
# 2. workflow_call: Call this workflow from another workflow with the URL
# 3. Manual: Uncomment pull_request trigger and set PREVIEW_URL secret/var

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to test (required for manual runs)'
        required: false
        type: string
      focus:
        description: 'Focus area: accessibility, performance, forms, mobile, all'
        required: false
        type: string
        default: 'all'
      fail_on_bugs:
        description: 'Fail workflow if critical/high bugs found'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      url:
        description: 'URL to test'
        required: true
        type: string
      focus:
        description: 'Focus area'
        required: false
        type: string
        default: 'all'
      fail_on_bugs:
        description: 'Fail on critical/high bugs'
        required: false
        type: boolean
        default: true
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  NODE_VERSION: '20'
  PLAYWRIGHT_VERSION: '1.48.0'

jobs:
  qa-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Determine Test URL
        id: get-url
        env:
          INPUT_URL: ${{ inputs.url }}
          PREVIEW_URL: ${{ vars.PREVIEW_URL || secrets.PREVIEW_URL || '' }}
        run: |
          # Priority: explicit input > PREVIEW_URL var/secret
          if [ -n "$INPUT_URL" ]; then
            echo "test_url=$INPUT_URL" >> $GITHUB_OUTPUT
            echo "✓ Using provided URL: $INPUT_URL"
          elif [ -n "$PREVIEW_URL" ]; then
            echo "test_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
            echo "✓ Using PREVIEW_URL: $PREVIEW_URL"
          else
            echo "❌ Error: No URL provided"
            echo ""
            echo "For manual runs: provide a URL in the workflow inputs"
            echo "For PR runs: set PREVIEW_URL as a repository variable or secret"
            echo "For Vercel/Netlify: chain this workflow after your deploy workflow"
            exit 1
          fi

      - name: Validate API Key
        env:
          QAI_PROVIDER: ${{ vars.QAI_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          provider=$(printf '%s' "$QAI_PROVIDER" | tr '[:upper:]' '[:lower:]')
          if [ "$provider" = "ollama" ]; then
            echo "✓ Ollama selected (no API key required)"
            exit 0
          fi
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$OPENAI_API_KEY" ] || [ -n "$GEMINI_API_KEY" ]; then
            echo "✓ Provider key configured"
            if [ -n "$provider" ]; then
              echo "✓ QAI_PROVIDER=$provider"
            fi
            exit 0
          fi
          echo "❌ Error: no provider API key is configured"
          echo "Add ANTHROPIC_API_KEY, OPENAI_API_KEY, or GEMINI_API_KEY to repository secrets."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 'true'

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright Deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Check URL is reachable
        id: url-check
        run: |
          echo "Checking if URL is reachable..."
          TEST_URL="${{ steps.get-url.outputs.test_url }}"

          # Try to reach the URL
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$TEST_URL" || echo "000")

          if [ "$HTTP_CODE" = "000" ]; then
            echo "⚠️ Warning: Could not reach $TEST_URL (connection failed)"
            echo "reachable=false" >> $GITHUB_OUTPUT
          elif [ "$HTTP_CODE" -ge 400 ]; then
            echo "⚠️ Warning: $TEST_URL returned HTTP $HTTP_CODE"
            echo "reachable=false" >> $GITHUB_OUTPUT
          else
            echo "✓ URL is reachable (HTTP $HTTP_CODE)"
            echo "reachable=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Screenshots Directory
        run: mkdir -p screenshots

      # QAI_PROVIDER (repository variable) selects the provider. anthropic or unset
      # keeps the Claude Code agent. openai, gemini, codex, and ollama use qai scan.
      - name: Run qai
        id: qa-run
        env:
          QAI_PROVIDER: ${{ vars.QAI_PROVIDER }}
          PROVIDER: ${{ vars.QAI_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEST_URL: ${{ steps.get-url.outputs.test_url }}
          TEST_FOCUS: ${{ inputs.focus || 'all' }}
          FOCUS: ${{ inputs.focus || 'all' }}
          URL: ${{ steps.get-url.outputs.test_url }}
        run: |
          set +e
          provider=$(printf '%s' "$QAI_PROVIDER" | tr '[:upper:]' '[:lower:]')
          echo "::group::QA Testing Configuration"
          echo "URL: $TEST_URL"
          echo "Focus Area: $TEST_FOCUS"
          echo "QAI_PROVIDER: ${provider:-auto}"
          echo "::endgroup::"

          echo "::group::Starting qai"
          START_TIME=$(date +%s)

          case "$provider" in
            openai|gemini|codex|ollama)
              echo "Running qai scan (provider: $provider)"
              timeout 300 node src/index.js scan "$TEST_URL" > qa-run.log 2>&1
              EXIT_CODE=$?
              ;;
            *)
            # 5 minute timeout, max 15 turns - be aggressive about speed
            timeout 300 npx @anthropic-ai/claude-code --print \
              --mcp-config .claude/mcp-config.json \
              --max-turns 15 \
              "SPEED IS CRITICAL. You have 3 minutes max.

               Test $TEST_URL:
               1. Navigate to URL
               2. Screenshot desktop view -> ./screenshots/desktop.png
               3. Screenshot mobile (375px) -> ./screenshots/mobile.png
               4. Check for console errors
               5. Click 2-3 buttons/links to verify they work
               6. Write ./qa-report.md: list any bugs found, or 'No issues found'

               DO NOT: test multiple viewports, do exhaustive testing, write long reports.
               STOP after basic checks. Speed > thoroughness." > qa-run.log 2>&1
            EXIT_CODE=$?
            # Claude Code only speaks Anthropic. If that call is a billing/auth/model
            # failure and another key is configured, qai scan uses getProvider fallback.
            if [ ! -f qa-report.md ] && { [ -n "$OPENAI_API_KEY" ] || [ -n "$GEMINI_API_KEY" ]; }; then
              if node -e 'const fs=require("fs");const {isProviderUnavailable}=require("./scripts/classify-qai-review");process.exit(isProviderUnavailable(fs.readFileSync("qa-run.log","utf8"))?0:1)'; then
                echo "Claude Code provider unavailable; running qai scan with the next provider"
                timeout 300 node src/index.js scan "$TEST_URL" > qa-scan.log 2>&1
                EXIT_CODE=$?
                cat qa-scan.log >> qa-run.log
              fi
            fi
              ;;
          esac

          if [ "$EXIT_CODE" -eq 124 ]; then
            echo "⚠️ QA testing timed out after 5 minutes" | tee -a qa-run.log
          elif [ "$EXIT_CODE" -ne 0 ]; then
            echo "⚠️ QA testing encountered an error (exit code: $EXIT_CODE)" | tee -a qa-run.log
          fi
          cat qa-run.log

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "✓ QA testing completed in ${DURATION}s"
          echo "::endgroup::"
          echo "qa_duration_seconds=$DURATION" >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          set -e

      - name: Classify qa-test result
        id: qa-classify
        run: node scripts/classify-qa-run.js qa-run.log "${{ steps.qa-run.outputs.exit_code }}"

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload QA Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report-${{ github.run_number }}
          path: qa-report.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## qai Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL Tested:** ${{ steps.get-url.outputs.test_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Focus Area:** ${{ inputs.focus || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.qa-classify.outputs.outcome }}" = "skipped" ]; then
            echo "⚠️ skipped: provider unavailable" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Provider/auth/billing failure is not a QA result." >> $GITHUB_STEP_SUMMARY
          elif [ -f "qa-report.md" ]; then
            echo "### Report" >> $GITHUB_STEP_SUMMARY
            cat qa-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No QA report generated. Check the logs for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        env:
          QA_OUTCOME: ${{ steps.qa-classify.outputs.outcome }}
          TEST_URL: ${{ steps.get-url.outputs.test_url }}
          TEST_FOCUS: ${{ inputs.focus || 'all' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const outcome = process.env.QA_OUTCOME || '';
            const testUrl = process.env.TEST_URL || '';
            const focus = process.env.TEST_FOCUS || 'all';
            const runUrl = process.env.RUN_URL || '';

            let body;
            if (outcome === 'skipped') {
              body = '## 🤖 qai Report — skipped: provider unavailable\n\n';
              body += `**URL Tested:** ${testUrl}\n`;
              body += `**Focus Area:** ${focus}\n\n`;
              body += 'Provider/auth/billing failure is not a QA result.\n';
            } else {
              body = '## 🤖 qai Report\n\n';
              body += `**URL Tested:** ${testUrl}\n`;
              body += `**Focus Area:** ${focus}\n\n`;
              if (fs.existsSync('qa-report.md')) {
                body += fs.readFileSync('qa-report.md', 'utf8');
              } else {
                body += `⚠️ No QA report generated. Check the [workflow logs](${runUrl}) for details.\n`;
              }
            }

            body += `\n\n### 📎 Artifacts\n`;
            body += `- [Screenshots](${runUrl})\n`;
            body += `- [Full Report](${runUrl})\n`;
            body += '\n---\n*Automated QA testing by [qai](https://github.com/tyler-james-bridges/qai-cli)*';

            // Find existing comment to update (avoid spam)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('qai Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Skip when provider unavailable
        if: steps.qa-classify.outputs.outcome == 'skipped'
        run: |
          echo "::warning::skipped: provider unavailable"
          echo "Provider/auth/billing failure is not a QA result."

      - name: Check for critical bugs
        if: ${{ github.event_name == 'pull_request' || inputs.fail_on_bugs }}
        run: |
          if [ ! -f "qa-report.md" ]; then
            echo "No QA report found - skipping bug check"
            exit 0
          fi

          echo "Checking for critical/high severity bugs..."

          # Case-insensitive search for critical or high severity indicators
          CRITICAL_COUNT=$(grep -i -c -E '(critical|severity:\s*critical)' qa-report.md || echo "0")
          HIGH_COUNT=$(grep -i -c -E '(high|severity:\s*high)' qa-report.md || echo "0")

          echo "Critical bugs: $CRITICAL_COUNT"
          echo "High severity bugs: $HIGH_COUNT"

          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::error::Found $CRITICAL_COUNT critical bug(s) - failing workflow"
            exit 1
          fi

          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "::warning::Found $HIGH_COUNT high severity bug(s) - failing workflow"
            exit 1
          fi

          echo "✓ No critical/high severity bugs found"
