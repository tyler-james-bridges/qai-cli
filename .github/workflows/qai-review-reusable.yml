name: QAI Code Review (Reusable)

on:
  workflow_call:
    inputs:
      provider:
        description: 'AI provider to use (anthropic, openai, or codex)'
        required: false
        type: string
        default: 'anthropic'
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'
      qai-version:
        description: 'qai-cli version (npm version specifier)'
        required: false
        type: string
        default: 'latest'
    secrets:
      api-key:
        description: 'API key for the chosen provider'
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install qai-cli
        run: npm install -g qai-cli@${{ inputs.qai-version }}

      - name: Run QAI Review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ inputs.provider == 'anthropic' && secrets.api-key || '' }}
          OPENAI_API_KEY: ${{ inputs.provider == 'openai' && secrets.api-key || '' }}
          CODEX_API_KEY: ${{ inputs.provider == 'codex' && secrets.api-key || '' }}
          PROVIDER: ${{ inputs.provider }}
          API_KEY: ${{ secrets.api-key }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          REVIEW=$(qai review ${{ github.event.pull_request.number }} --json 2>&1)
          EXIT_CODE=$?
          printf '%s\n' "$REVIEW" > review-output.json
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          set -e

      - name: Classify review result
        id: classify
        env:
          REVIEW_EXIT_CODE: ${{ steps.review.outputs.exit_code }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const output = fs.readFileSync('review-output.json', 'utf8');
          const exitCode = process.env.REVIEW_EXIT_CODE || '0';
          const providerRe =
            /provider error|credit balance|insufficient credits?|invalid api key|invalid x-api-key|authentication_error|not_found_error|no api key provided|404[\s\S]{0,400}model|model[\s\S]{0,400}404/i;
          const objects = [];
          let start = -1;
          let depth = 0;
          let inString = false;
          let escape = false;
          for (let i = 0; i < output.length; i++) {
            const ch = output[i];
            if (inString) {
              if (escape) escape = false;
              else if (ch === '\\') escape = true;
              else if (ch === '"') inString = false;
              continue;
            }
            if (ch === '"') { inString = true; continue; }
            if (ch === '{') { if (depth === 0) start = i; depth += 1; }
            else if (ch === '}') {
              if (depth === 0) continue;
              depth -= 1;
              if (depth === 0 && start >= 0) {
                try { objects.push(JSON.parse(output.slice(start, i + 1))); } catch {}
                start = -1;
              }
            }
          }
          let report = null;
          for (let i = objects.length - 1; i >= 0; i--) {
            if (objects[i] && Array.isArray(objects[i].issues)) {
              report = objects[i];
              break;
            }
          }
          let outcome = 'pass';
          let note = 'QAI review completed';
          if (report) {
            const n = report.issues.filter((issue) => issue && issue.severity === 'critical').length;
            if (n > 0) {
              outcome = 'fail';
              note = 'QAI review found ' + n + ' critical issue(s)';
            } else {
              note = 'QAI review found no critical issues';
            }
          } else if (providerRe.test(output) || Number(exitCode) !== 0) {
            outcome = 'skipped';
            note = 'skipped: provider unavailable';
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'outcome=' + outcome + '\nnote=' + note + '\n');
          NODE

      - name: Post Review Comment
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.classify.outputs.outcome }}
          NOTE: ${{ steps.classify.outputs.note }}
        run: |
          BODY=$(cat review-output.json)
          if [ "$OUTCOME" = "skipped" ]; then
            HEADER="## 🤖 QAI Code Review — skipped: provider unavailable"
            INTRO="Provider/auth/billing failure is not a review finding. lint and qa-test remain the merge gates."
          elif [ "$OUTCOME" = "fail" ]; then
            HEADER="## 🤖 QAI Code Review — critical findings"
            INTRO="$NOTE"
          else
            HEADER="## 🤖 QAI Code Review"
            INTRO="$NOTE"
          fi
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "$HEADER

          $INTRO

          <details>
          <summary>Review Details</summary>

          \`\`\`json
          $BODY
          \`\`\`

          </details>"

      - name: Skip when provider unavailable
        if: steps.classify.outputs.outcome == 'skipped'
        run: |
          echo "::warning::skipped: provider unavailable"
          echo "${{ steps.classify.outputs.note }}"

      - name: Fail on Critical Issues
        if: steps.classify.outputs.outcome == 'fail'
        run: |
          echo "::error::${{ steps.classify.outputs.note }}"
          exit 1
