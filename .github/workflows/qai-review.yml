name: QAI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install from main, not the PR head and not the npm package.
      # A pull request must not be able to change the reviewer that runs with secrets.
      - name: Install qai-cli
        run: |
          npm install -g github:tyler-james-bridges/qai-cli#main
          qai --version

      - name: Run QAI Review
        id: review
        env:
          QAI_PROVIDER: ${{ vars.QAI_PROVIDER }}
          PROVIDER: ${{ vars.QAI_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          REVIEW=$(qai review ${{ github.event.pull_request.number }} --json 2>&1)
          EXIT_CODE=$?
          printf '%s\n' "$REVIEW" > review-output.json
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          set -e

      # Provider/auth/billing failures (credit balance, invalid key, 404 model)
      # are skipped: the job stays green. Only parsed JSON with severity=critical fails.
      - name: Classify review result
        id: classify
        run: node scripts/classify-qai-review.js review-output.json "${{ steps.review.outputs.exit_code }}"

      - name: Post Review Comment
        if: steps.classify.outputs.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.classify.outputs.outcome }}
          NOTE: ${{ steps.classify.outputs.note }}
        run: |
          BODY=$(cat review-output.json)
          if [ "$OUTCOME" = "fail" ]; then
            HEADER="## 🤖 QAI Code Review — critical findings"
            INTRO="$NOTE"
          else
            HEADER="## 🤖 QAI Code Review"
            INTRO="$NOTE"
          fi
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "$HEADER

          $INTRO

          <details>
          <summary>Review Details</summary>

          \`\`\`json
          $BODY
          \`\`\`

          </details>"

      # Script is the copy inside the qai package installed from GitHub main.
      # Do not run the checkout copy: this step has the write token and TYPESAFE_API_KEY.
      - name: Post change-risk fallback
        if: steps.classify.outputs.outcome == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SKIP_REASON: ${{ steps.classify.outputs.note }}
          REVIEW_LOG: review-output.json
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          script="$(npm root -g)/qai-cli/scripts/qai-review-fallback.js"
          if [ ! -f "$script" ]; then
            echo "::warning::change-risk fallback script is not in the qai install from main"
            exit 0
          fi
          node "$script" || echo "::warning::change-risk fallback did not complete"

      - name: Skip when provider unavailable
        if: steps.classify.outputs.outcome == 'skipped'
        run: |
          echo "::warning::skipped: provider unavailable"
          echo "${{ steps.classify.outputs.note }}"
          echo "Posted change-risk fallback. It is not an AI review finding."
          echo "lint and qa-test remain the merge gates."

      - name: Fail on Critical Issues
        if: steps.classify.outputs.outcome == 'fail'
        run: |
          echo "::error::${{ steps.classify.outputs.note }}"
          exit 1
